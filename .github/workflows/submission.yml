name: Process setup submission

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  process:
    if: contains(github.event.issue.labels.*.name, 'submission') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      # The issue text is passed through environment variables only, never pasted into the script.
      - name: Build and validate the setup
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python scripts/submission.py
          cat submission.env >> "$GITHUB_ENV"

      - name: Open or update the pull request
        if: env.OK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          branch="submission/issue-${ISSUE_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add "setups/${SLUG}"
          if git diff --cached --quiet; then
            echo "This setup is identical to the one already in the gallery: nothing to update." > comment.md
            gh issue comment "$ISSUE_NUMBER" --body-file comment.md
            exit 0
          fi
          git commit -m "Add setup ${SLUG} (#${ISSUE_NUMBER})"
          git push --force origin "$branch"

          {
            echo "Submitted by @${ISSUE_AUTHOR} in #${ISSUE_NUMBER}."
            echo
            cat submission-report.md
          } > pr-body.md

          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr edit "$branch" --body-file pr-body.md
          else
            gh pr create --base main --head "$branch" --title "Setup: ${SLUG}" --body-file pr-body.md
          fi

          pr_url=$(gh pr view "$branch" --json url --jq .url)
          {
            cat submission-report.md
            echo
            echo "Your setup is ready for review: ${pr_url}"
            echo "It will appear in the gallery once it's approved."
          } > comment.md
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md

      - name: Report problems
        if: env.OK != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file submission-report.md
