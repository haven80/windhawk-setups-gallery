name: Validate setup

on:
  pull_request:
    paths: ["setups/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The validator always comes from main, so a pull request can't weaken the checks.
      - name: Get the validator from main
        run: |
          git fetch origin main
          mkdir -p /tmp/trusted
          git show origin/main:scripts/validate.py > /tmp/trusted/validate.py
          git show origin/main:scripts/requirements.txt > /tmp/trusted/requirements.txt
          cp /tmp/trusted/validate.py scripts/validate.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r /tmp/trusted/requirements.txt

      - name: Validate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python scripts/validate.py --pr "$BASE_SHA" "$AUTHOR" --report report.md

      - name: Summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" || true
